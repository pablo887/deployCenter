# El agente en modo conectado (Fase 2): queda levantado y le pide órdenes al hub.
#
# Uno por host. Toda la conexión es saliente, por 443, a deploy.accusys.com.ar.
# No abre ningún puerto.
#
# Alta: Soporte de Accusys genera en la web la llave del cliente (Agentes →
# Llaves de enrolamiento). Se completa el .env de este directorio:
#
#   DC_HUB_URL=https://deploy.accusys.com.ar
#   DC_CLIENTE=banco-andino
#   DC_LLAVE=DCK-XXXX-XXXX-XXXX-XXXX-XXXX
#   DC_AMBIENTE=produccion
#
# y se levanta:
#
#   docker compose up -d
#
# El agente pide conexión y queda esperando. Aparece en la web, en Agentes →
# Pedidos de conexión, con su host, cliente, ambiente e IP; cuando Soporte lo
# acepta, recibe su token y empieza a trabajar. La llave sola no conecta nada.
# Mientras espera, `docker compose logs -f agente` muestra en qué está.
#
# Baja: Accusys revoca el agente desde el hub. El servidor no se toca; el agente
# ve el token revocado y se detiene.

name: deploycenter-agente

services:
  agente:
    image: registry.accusys.com.ar/deploycenter/agente:0.2.0
    restart: unless-stopped
    environment:
      # Con esto el agente pide conexión la primera vez; después usa su token.
      DC_HUB_URL: ${DC_HUB_URL:?falta DC_HUB_URL en el .env}
      DC_CLIENTE: ${DC_CLIENTE:?falta DC_CLIENTE en el .env}
      DC_LLAVE: ${DC_LLAVE:?falta DC_LLAVE en el .env}
      DC_AMBIENTE: ${DC_AMBIENTE:?falta DC_AMBIENTE en el .env}
      # Opcional: el nombre con que se presenta. Por defecto, el del contenedor;
      # conviene poner el del servidor.
      DC_HOST: ${DC_HOST:-}
      # Si la salida del servidor pasa por un proxy, el agente lo toma de acá.
      # HTTPS_PROXY: http://proxy.cliente.local:3128
      NO_PROXY: localhost,127.0.0.1
    volumes:
      # El socket de Docker. Es acceso de root al host: está acotado por
      # --raiz-permitida y por el catálogo cerrado de operaciones del agente.
      - /var/run/docker.sock:/var/run/docker.sock
      # Los stacks de los productos instalados en este host.
      - /opt/accusys:/stacks
      # Credenciales, buzón y paquetes recibidos. Sobrevive a los reinicios.
      - /var/lib/deploycenter:/var/lib/deploycenter
      # Clave pública con la que Accusys firma los manifiestos. La pone el
      # cliente, no la manda el hub: es lo que impide que un hub comprometido
      # haga desplegar algo que Accusys no firmó.
      - ./cosign.pub:/etc/deploycenter/cosign.pub:ro
      # Si el proxy inspecciona TLS, la CA interna del cliente:
      # - ./ca-interna.pem:/etc/deploycenter/ca.pem:ro
    command:
      - --raiz-permitida=/stacks
      - conectar
      - --raiz=/stacks
      - --clave-publica=/etc/deploycenter/cosign.pub
      # - --ca=/etc/deploycenter/ca.pem
