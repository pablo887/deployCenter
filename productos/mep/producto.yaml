# MEP — el núcleo común a todos los bancos.
#
# Relevado del docker-compose.yml y el .env de una instalación real (Naranja X).
# Lo que es de cada banco —su connector y su contable— no va acá: es otro
# producto, `mep-<banco>`, con su propio stack y su propia versión (ver
# productos/mep-naranjax). Los dos stacks se hablan por la red externa
# uw2-backend, que crea UniWeb.

codigo: mep
nombre: MEP
descripcion: Mercado Electrónico de Pagos — núcleo (api, front, worker y BCRA)

# Docker Hub, organización de Accusys. Los clientes descargan con un usuario de
# solo lectura: `docker login` en el host del cliente antes del primer pull.
registry: docker.io/accusystechnology

plantilla: compose.plantilla.yaml

# Servicios que publica Accusys. La clave es el nombre del repo en el registry
# y el del servicio en el compose. Redis y RabbitMQ son de terceros: van en la
# plantilla con tag fijo, no acá.
#
# Ninguno expone una URL de salud: el criterio es el healthcheck del contenedor
# que declara la plantilla (tipo: contenedor).
servicios:
  mep-api:
    descripcion: API de MEP. Aplica las migraciones de la base al arrancar.
    healthcheck:
      tipo: contenedor
      timeout_s: 300
  mep-app:
    descripcion: Front de operación
    healthcheck:
      tipo: contenedor
      timeout_s: 180
  mep-worker:
    descripcion: Procesamiento asíncrono (RabbitMQ)
    healthcheck:
      tipo: contenedor
      timeout_s: 120
  mep-bcra:
    descripcion: Conector con los servicios MEP del BCRA
    healthcheck:
      tipo: contenedor
      timeout_s: 120

# Lo que el stack necesita y no levanta él. El preflight abre una conexión TCP a
# cada uno antes de desplegar, con host y puerto tomados del .env del cliente.
dependencias:
  - nombre: base
    host: ${CS_SERVER}
    puerto: ${CS_PORT}
  - nombre: base-logs
    host: ${CS_LOG_SERVER}
    puerto: ${CS_LOG_PORT}
